name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint, Migrate and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warehouse_user
          POSTGRES_PASSWORD: warehouse_password
          POSTGRES_DB: warehouse_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://warehouse_user:warehouse_password@127.0.0.1:5432/warehouse_test_db
      TEST_DATABASE_URL: postgresql://warehouse_user:warehouse_password@127.0.0.1:5432/warehouse_test_db
      JWT_SECRET_KEY: test-secret-key-for-github-actions-pipeline-min-32-chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Kodni yuklab olish (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.12 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dependencylarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff Lint tekshiruvi
        run: ruff check .

      - name: Ruff Format tekshiruvi
        run: ruff format --check .

      - name: Bo'sh PostgreSQL bazada Alembic migratsiyasi
        run: alembic upgrade head

      - name: Pytest orqali barcha testlarni bajarish
        run: pytest -v

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish (Checkout)
        uses: actions/checkout@v4

      - name: SSH orqali EC2 ga ulanib deploy qilish
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Agar kerakli server ma'lumotlari kiritilmagan bo'lsa, xato beradi
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::EC2_HOST yoki EC2_SSH_KEY GitHub Secrets sozlanmagan!"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            echo "$EC2_KNOWN_HOSTS" >> ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          fi

          ssh "${EC2_USER}@${EC2_HOST}" "bash /opt/warehouse-api/deploy/deploy.sh $COMMIT_SHA"
